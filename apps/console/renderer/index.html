<!doctype html>
<html lang="id">
<head>
    <meta charset="utf-8">
    <meta http-equiv="Content-Security-Policy"
          content="default-src 'none';
                   script-src 'self';
                   style-src 'self' 'unsafe-inline';
                   img-src 'self' data: blob:;
                   media-src 'self' blob: mediastream:;
                   font-src 'self';
                   connect-src http: https: ws: wss:;">
    <title>Aether Console</title>
    <link rel="stylesheet" href="styles/tokens.css">
    <link rel="stylesheet" href="styles/layout.css">
    <link rel="stylesheet" href="styles/components.css">
    <link rel="stylesheet" href="vendor/xterm/xterm.css">
</head>
<body>

<div id="shell">

    <!-- ================= Titlebar ================= -->
    <header class="titlebar">

        <div class="brand">
            <span class="mark" id="brand-mark"></span>
            <span class="name">Aether</span>
            <span class="sub">Console</span>
        </div>

        <div class="drag-free" id="connection-chip"></div>

        <div class="spacer"></div>

        <div class="drag-free" id="titlebar-actions"></div>

        <div class="window-controls">
            <button id="win-min" title="Minimize"></button>
            <button id="win-max" title="Maximize"></button>
            <button id="win-close" class="close" title="Close"></button>
        </div>

    </header>

    <!-- ================= Badan ================= -->
    <div class="body">

        <nav class="sidebar" id="sidebar"></nav>

        <main class="content" id="content">

            <section class="view active" data-view="dashboard" id="view-dashboard"></section>
            <section class="view" data-view="awareness" id="view-awareness"></section>
            <section class="view" data-view="aether" id="view-aether"></section>
            <section class="view" data-view="memory" id="view-memory"></section>
            <section class="view" data-view="models" id="view-models"></section>
            <section class="view" data-view="integrations" id="view-integrations"></section>
            <section class="view" data-view="devices" id="view-devices"></section>
            <section class="view" data-view="skills" id="view-skills"></section>
            <section class="view" data-view="agents" id="view-agents"></section>
            <section class="view" data-view="home" id="view-home"></section>
            <section class="view" data-view="vision" id="view-vision"></section>
            <section class="view" data-view="runtime" id="view-runtime"></section>
            <section class="view" data-view="family" id="view-family"></section>
            <section class="view" data-view="nas" id="view-nas"></section>
            <section class="view" data-view="logs" id="view-logs"></section>
            <section class="view" data-view="settings" id="view-settings"></section>

        </main>

    </div>

    <!-- ================= Bottom status bar ================= -->
    <footer class="statusbar" id="statusbar"></footer>

    <!-- ================= Floating Assistant ================= -->
    <button class="fab-assistant" id="fab-assistant" title="Aether — Command Palette (Ctrl+K)">
        <span class="orb"></span>
    </button>

</div>

<!-- xterm.js divendor (CSP: tanpa CDN) — set global sebelum modul app.js -->
<script src="vendor/xterm/xterm.js"></script>
<script src="vendor/xterm/addon-fit.js"></script>
<script src="vendor/xterm/addon-search.js"></script>

<script type="module" src="app.js"></script>

</body>
</html>
