<!doctype html>
<html lang="id">
<head>
    <meta charset="utf-8">
    <meta http-equiv="Content-Security-Policy"
          content="default-src 'none';
                   script-src 'self';
                   style-src 'self' 'unsafe-inline';
                   img-src 'self' data: blob:;
                   media-src 'self' blob: mediastream:;
                   font-src 'self';
                   connect-src http: https:;">
    <title>Aether Console</title>
    <link rel="stylesheet" href="styles/tokens.css">
    <link rel="stylesheet" href="styles/layout.css">
    <link rel="stylesheet" href="styles/components.css">
</head>
<body>

<div id="shell">

    <!-- ================= Titlebar ================= -->
    <header class="titlebar">

        <div class="brand">
            <span class="mark" id="brand-mark"></span>
            <span class="name">Aether</span>
            <span class="sub">Console</span>
        </div>

        <div class="drag-free" id="connection-chip"></div>

        <div class="spacer"></div>

        <div class="drag-free" id="titlebar-actions"></div>

        <div class="window-controls">
            <button id="win-min" title="Minimize"></button>
            <button id="win-max" title="Maximize"></button>
            <button id="win-close" class="close" title="Close"></button>
        </div>

    </header>

    <!-- ================= Badan ================= -->
    <div class="body">

        <nav class="sidebar" id="sidebar"></nav>

        <main class="content" id="content">

            <section class="view active" data-view="dashboard" id="view-dashboard"></section>
            <section class="view" data-view="aether" id="view-aether"></section>
            <section class="view" data-view="chat" id="view-chat"></section>
            <section class="view" data-view="memory" id="view-memory"></section>
            <section class="view" data-view="models" id="view-models"></section>
            <section class="view" data-view="integrations" id="view-integrations"></section>
            <section class="view" data-view="devices" id="view-devices"></section>
            <section class="view" data-view="plugins" id="view-plugins"></section>
            <section class="view" data-view="studio" id="view-studio"></section>
            <section class="view" data-view="agents" id="view-agents"></section>
            <section class="view" data-view="home" id="view-home"></section>
            <section class="view" data-view="vision" id="view-vision"></section>
            <section class="view" data-view="logs" id="view-logs"></section>
            <section class="view" data-view="settings" id="view-settings"></section>

        </main>

    </div>

</div>

<script type="module" src="app.js"></script>

</body>
</html>
